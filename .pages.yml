# Pages CMS configuration - https://pagescms.org/docs/
# Content lives in /content (JSON). Uploaded images go to /assets/images. The static pages are generated from it by scripts/build.mjs.
media:
  input: assets/images
  output: /assets/images
  rename: safe
  extensions: [jpg, jpeg, png, webp]

components:
  nearby:
    type: object
    label: Nearby place
    list: true
    fields:
      - { name: place, label: Place, type: string, required: true }
      - { name: distance, label: Distance / time, type: string, description: "e.g. 600 m, 5 min drive" }
      - { name: mode, label: Measured how, type: select, default: unspecified, options: { values: [driving, straight-line, unspecified] } }
  coordinates:
    type: object
    label: Map coordinates (optional)
    fields:
      - { name: lat, label: Latitude, type: number, description: "e.g. 7.8804" }
      - { name: lng, label: Longitude, type: number, description: "e.g. 98.3923" }
  availability:
    type: select
    label: Availability
    default: Available
    options: { values: [Available, Reserved, Rented, Sold] }

content:
  - name: settings
    label: Site settings & WhatsApp number
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: siteName, label: Site name, type: string, required: true }
      - { name: siteUrl, label: Site URL, type: string, required: true }
      - { name: whatsappNumber, label: WhatsApp number, type: string, required: true, description: "Digits only, with country code, no + (e.g. 66942654121). Used everywhere.", pattern: { regex: "^[0-9]{8,15}$", message: "Digits only, no + or spaces" } }
      - { name: phoneDisplay, label: Phone (display), type: string }
      - { name: email, label: Email, type: string }
      - { name: address, label: Address, type: string }
      - { name: instagram, label: Instagram URL, type: string }
      - { name: heroImage, label: Home hero image, type: image }
      - { name: heroTitle, label: Home hero title, type: string }
      - { name: heroSubtitle, label: Home hero subtitle, type: text }
      - { name: aboutText, label: About text, type: text }

  - name: rent
    label: Rent
    type: collection
    path: content/properties/rent
    format: json
    subfolders: false
    filename: "{primary}.json"
    view: { primary: title, fields: [location, price, availability, published], sort: publishedAt, order: desc }
    fields: &property_fields
      - { name: title, label: Title, type: string, required: true, description: "The filename (URL slug) is created from the title and cannot be changed later." }
      - { name: published, label: Published (visible on website), type: boolean, default: true }
      - { name: featured, label: Featured on homepage, type: boolean, default: false }
      - { name: publishedAt, label: Publication date, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: propertyType, label: Property type, type: select, required: true, options: { values: [Condo, Villa, House, Townhouse, Apartment, Land, Commercial] } }
      - { name: location, label: Location / area, type: string, required: true, description: "e.g. Kata, Rawai, Patong. Used by the Location filter, keep spelling consistent." }
      - { name: price, label: Price, type: number, required: true }
      - { name: currency, label: Currency, type: select, default: THB, options: { values: [THB, USD] } }
      - { name: pricePeriod, label: Rent price period (rent only), type: select, default: month, options: { values: [month, night, year] } }
      - { name: bedrooms, label: Bedrooms, type: number }
      - { name: bathrooms, label: Bathrooms, type: number }
      - { name: livingArea, label: Living area (sqm), type: number }
      - { name: landArea, label: Land area (sqm), type: number }
      - { name: floor, label: Floor, type: string }
      - { name: ownership, label: Ownership (sale only), type: select, options: { values: [Freehold, Leasehold] } }
      - { name: furnishing, label: Furnishing, type: select, options: { values: [Furnished, Partly furnished, Unfurnished] } }
      - { name: yearBuilt, label: Year built, type: number }
      - { name: shortDescription, label: Short description (card text), type: string }
      - { name: description, label: Full description, type: text, description: "Plain text. Blank line = new paragraph. HTML is not allowed (escaped on build)." }
      - { name: facilities, label: Facilities & amenities, type: string, list: true }
      - { name: nearby, label: Nearby attractions, component: nearby }
      - { name: coordinates, label: Map coordinates, component: coordinates }
      - { name: cover, label: Cover image, type: image, required: true, options: { path: assets/images/properties, extensions: [jpg, jpeg, png, webp] } }
      - { name: images, label: Gallery images (drag to reorder), type: image, list: true, options: { path: assets/images/properties, extensions: [jpg, jpeg, png, webp] } }
      - { name: availability, label: Availability, component: availability }

  - name: sale
    label: Sale
    type: collection
    path: content/properties/sale
    format: json
    subfolders: false
    filename: "{primary}.json"
    view: { primary: title, fields: [location, price, ownership, availability, published], sort: publishedAt, order: desc }
    fields:
      - { name: project, label: Linked new project (optional), type: reference, description: "Links this Sale entry to its project page (View Project button). The fields below are shown on the Sale card; any left empty fall back to the project data. Floor plans and unit types are edited under New Projects.", options: { collection: projects, search: name, value: "{path}", label: "{name}" } }
      - { name: title, label: Title, type: string, required: true, description: "The filename (URL slug) is created from the title and cannot be changed later." }
      - { name: published, label: Published (visible on website), type: boolean, default: true }
      - { name: featured, label: Featured on homepage, type: boolean, default: false }
      - { name: publishedAt, label: Publication date, type: date, options: { format: yyyy-MM-dd } }
      - { name: propertyType, label: Property type, type: select, options: { values: [Condo, Villa, House, Townhouse, Apartment, Land, Commercial] } }
      - { name: location, label: Location / area, type: string, description: "e.g. Kata, Rawai, Patong. Used by the Location filter, keep spelling consistent." }
      - { name: price, label: Price, type: number }
      - { name: currency, label: Currency, type: select, default: THB, options: { values: [THB, USD] } }
      - { name: pricePeriod, label: Rent price period (rent only), type: select, default: month, options: { values: [month, night, year] } }
      - { name: bedrooms, label: Bedrooms, type: number }
      - { name: bathrooms, label: Bathrooms, type: number }
      - { name: livingArea, label: Living area (sqm), type: number }
      - { name: landArea, label: Land area (sqm), type: number }
      - { name: floor, label: Floor, type: string }
      - { name: ownership, label: Ownership (sale only), type: select, options: { values: [Freehold, Leasehold] } }
      - { name: furnishing, label: Furnishing, type: select, options: { values: [Furnished, Partly furnished, Unfurnished] } }
      - { name: yearBuilt, label: Year built, type: number }
      - { name: shortDescription, label: Short description (card text), type: string }
      - { name: description, label: Full description, type: text, description: "Plain text. Blank line = new paragraph. HTML is not allowed (escaped on build)." }
      - { name: facilities, label: Facilities & amenities, type: string, list: true }
      - { name: nearby, label: Nearby attractions, component: nearby }
      - { name: coordinates, label: Map coordinates, component: coordinates }
      - { name: cover, label: Cover image, type: image, options: { path: assets/images/properties, extensions: [jpg, jpeg, png, webp] } }
      - { name: images, label: Gallery images (drag to reorder), type: image, list: true, options: { path: assets/images/properties, extensions: [jpg, jpeg, png, webp] } }
      - { name: availability, label: Availability, component: availability }

  - name: projects
    label: New Projects
    type: collection
    path: content/projects
    format: json
    subfolders: false
    filename: "{primary}.json"
    view: { primary: name, fields: [location, developer, constructionStatus, published], sort: publishedAt, order: desc }
    fields:
      - { name: name, label: Project name, type: string, required: true }
      - { name: published, label: Published (visible on website), type: boolean, default: true }
      - { name: featured, label: Featured on homepage, type: boolean, default: false }
      - { name: publishedAt, label: Publication date, type: date, options: { format: yyyy-MM-dd } }
      - { name: developer, label: Developer, type: string }
      - { name: projectType, label: Project type (free text, e.g. Condominium, pool villa, townhouse), type: string, required: true }
      - { name: imagesStatus, label: Photo status, type: select, description: "Set to unavailable when no rights-cleared photos exist; the site then shows a 'Photos on request' placeholder.", options: { values: [available, unavailable] } }
      - { name: imageCredit, label: Image credit / disclaimer shown under the gallery, type: text }
      - { name: imageCaptions, label: Gallery image descriptions (alt text, same order as gallery), type: string, list: true }
      - { name: researchNotes, label: Internal research notes (not shown on the website), type: text }
      - { name: category, label: Category, type: select, required: true, default: Condominium, options: { values: [Villa, Townhouse, Condominium] } }
      - { name: priceStatus, label: Price status, type: select, options: { values: [advertised, on-request] } }
      - { name: priceNote, label: Price note (e.g. which unit the starting price is for), type: string }
      - { name: priceType, label: Price type, type: select, description: "Who published the starting price", options: { values: [Developer price, Agent advertised price, Resale price] } }
      - { name: priceSourceUrl, label: Price source URL, type: string }
      - { name: lastVerified, label: Date prices/data were last verified, type: date, options: { format: yyyy-MM-dd } }
      - { name: bedroomsMin, label: Bedrooms (min), type: number }
      - { name: bedroomsMax, label: Bedrooms (max), type: number }
      - { name: bathroomsMin, label: Bathrooms (min), type: number }
      - { name: bathroomsMax, label: Bathrooms (max), type: number }
      - { name: builtUpMin, label: Built-up area min (sqm), type: number }
      - { name: builtUpMax, label: Built-up area max (sqm), type: number }
      - { name: landMin, label: Land area min (sqm), type: number }
      - { name: landMax, label: Land area max (sqm), type: number }
      - { name: floors, label: Floors, type: string }
      - { name: privatePool, label: Private pool, type: select, options: { values: ["yes", "some", "no"] } }
      - { name: parking, label: Parking, type: string }
      - { name: furniture, label: Furniture package, type: string }
      - { name: ownership, label: Ownership (only if verified), type: select, options: { values: [Freehold, Leasehold], multiple: true } }
      - { name: constructionStart, label: Construction start, type: string }
      - { name: paymentPlan, label: Payment plan (one step per line), type: string, list: true }
      - { name: reservationFee, label: Reservation fee, type: string }
      - { name: promotions, label: Promotions, type: string }
      - { name: commonAreaFee, label: Common area fee, type: string }
      - { name: sinkingFund, label: Sinking fund, type: string }
      - { name: website, label: Project / developer website, type: string }
      - { name: googleMapsUrl, label: Google Maps URL, type: string }
      - name: sources
        label: Sources
        type: object
        list: { collapsible: { collapsed: true, summary: "{label}" } }
        fields:
          - { name: label, label: Label, type: string }
          - { name: url, label: URL, type: string }
      - { name: location, label: Location / area, type: string, required: true }
      - { name: constructionStatus, label: Construction status, type: select, required: true, options: { values: [Pre-sale, Under construction, Completed, Status on request] } }
      - { name: completionDate, label: Completion date, type: string, description: "e.g. 2027-12 or Q4 2027" }
      - { name: totalUnits, label: Total units, type: number }
      - { name: startingPrice, label: Starting price, type: number }
      - { name: currency, label: Currency, type: select, default: THB, options: { values: [THB, USD] } }
      - { name: shortDescription, label: Short description (card text), type: string }
      - { name: description, label: Full description, type: text }
      - { name: facilities, label: Facilities & amenities, type: string, list: true }
      - { name: cover, label: Cover image (leave empty if you have no rights-cleared photos), type: image, options: { path: assets/images/projects, extensions: [jpg, jpeg, png, webp] } }
      - { name: images, label: Gallery images (drag to reorder), type: image, list: true, options: { path: assets/images/projects, extensions: [jpg, jpeg, png, webp] } }
      - { name: floorPlans, label: Floor plans, type: image, list: true, options: { path: assets/images/floorplans, extensions: [jpg, jpeg, png, webp] } }
      - name: unitTypes
        label: Available unit types
        type: object
        list: { collapsible: { collapsed: true, summary: "{name}" } }
        fields:
          - { name: name, label: Unit type, type: string, required: true, description: "Studio, 1 Bedroom, Penthouse..." }
          - { name: size, label: Built-up size (sqm, e.g. 30 or 30-36), type: string }
          - { name: landSqm, label: Land (sqm), type: string }
          - { name: bedrooms, label: Bedrooms, type: number }
          - { name: bathrooms, label: Bathrooms, type: number }
          - { name: price, label: Starting price, type: number }
          - { name: floor, label: Floor / level (condos, e.g. 3-5), type: string }
          - { name: priceType, label: Unit price type, type: select, options: { values: [Developer price, Agent advertised price, Resale price] } }
          - { name: availability, label: Availability, type: select, options: { values: [Available, Limited, Sold] } }
          - { name: floorPlan, label: Floor plan, type: image, options: { path: assets/images/floorplans } }
      - name: faq
        label: FAQ (optional; shown on the page. If empty, factual answers are generated from the project data)
        type: object
        list: { collapsible: { collapsed: true, summary: "{question}" } }
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }
      - { name: videoUrl, label: YouTube video URL (optional), type: string }
      - { name: nearby, label: Nearby attractions & distances, component: nearby }
      - { name: coordinates, label: Map coordinates, component: coordinates }

  - name: locations
    label: Location pages (SEO text)
    type: collection
    path: content/locations
    format: json
    subfolders: false
    filename: "{primary}.json"
    view:
      fields: [ name ]
      primary: name
    fields:
      - { name: name, label: "Location name (for your reference; filename must match the URL slug, e.g. bang-tao)", type: string }
      - { name: overview, label: "Area overview (verified, original text)", type: text }
      - { name: market, label: "Property market overview (verified)", type: text }
      - { name: transport, label: "Transport and airport access (verified)", type: text }

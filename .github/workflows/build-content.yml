# PREPARED LOCALLY, NOT ACTIVE UNTIL PUSHED. Review before publishing.
# Rebuilds generated pages when CMS content changes and commits the result back to the same branch.
# GitHub Pages keeps publishing from the branch root exactly as it does today (no Pages settings change needed).
name: Build content
on:
  push:
    branches: [main]
    paths: ['content/**', 'assets/images/**', 'scripts/**', '.pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-content
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate content (fails the job on bad data; nothing is published)
        run: npm run check
      - run: npm run optimize
      - run: npm run build
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: rebuild site from content [skip ci]"
          git push
